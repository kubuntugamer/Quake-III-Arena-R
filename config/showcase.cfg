// ============================================================================
// vkq3ng RT Showcase Map - Auto-exec Configuration
// Place in baseq3/rt_showcase.cfg or auto-exec via map script
// ============================================================================

// ----------------------------------------------------------------------------
// Renderer Selection
// ----------------------------------------------------------------------------
// 0 = Rasterization (classic), 2 = Ray Tracing
seta r_vertexLight "2"

// ----------------------------------------------------------------------------
// Ray Tracing Settings
// ----------------------------------------------------------------------------
// Samples per pixel per frame (higher = less noise, slower)
seta rt_numSamples "4"

// Accumulate samples over frames for progressive refinement
seta rt_accumulate "1"

// Maximum accumulated samples (0 = unlimited)
seta rt_maxSamples "0"

// ----------------------------------------------------------------------------
// RT Effects
// ----------------------------------------------------------------------------
// Soft shadows (penumbra)
seta rt_softshadows "1"

// Depth of field
seta rt_dof "1"
seta rt_focallength "300"
seta rt_aperture "2.8"

// Ray bounce depth
seta rt_numBounces "4"
seta rt_numRandomDL "2"   // Diffuse bounces
seta rt_numRandomIL "1"   // Indirect bounces

// Indirect illumination
seta rt_illumination "1"
seta rt_cullLights "1"

// Denoiser (temporal/spatial)
seta rt_denoiser "1"

// Temporal anti-aliasing
seta rt_taa "1"

// Tonemapping
seta rt_tonemapping_reinhard "1"
seta rt_brightness "1.0"

// ----------------------------------------------------------------------------
// Performance / Quality Presets
// ----------------------------------------------------------------------------
// Uncomment ONE preset:

// ULTRA QUALITY (RTX 4090 / 7900 XTX)
// seta rt_numSamples "16"
// seta rt_maxSamples "256"
// seta rt_numBounces "8"

// HIGH QUALITY (RTX 3080 / 6800 XT)
// seta rt_numSamples "8"
// seta rt_maxSamples "128"
// seta rt_numBounces "6"

// BALANCED (RTX 3060 / 6700 XT) - DEFAULT
// seta rt_numSamples "4"
// seta rt_maxSamples "64"
// seta rt_numBounces "4"

// PERFORMANCE (RTX 2060 / 6600)
// seta rt_numSamples "2"
// seta rt_maxSamples "32"
// seta rt_numBounces "2"
// seta rt_denoiser "1"

// ----------------------------------------------------------------------------
// Video Settings
// ----------------------------------------------------------------------------
seta r_mode "14"              // Desktop resolution
seta r_fullscreen "1"
seta r_swapInterval "1"       // VSync
seta com_maxfps "144"

// FSR upscaling (raster path only, not used in RT)
seta r_fsrScale "0"

// ----------------------------------------------------------------------------
// Input
// ----------------------------------------------------------------------------
seta sensitivity "5"
seta cl_mouseAccel "0"
seta m_pitch "0.022"
seta m_yaw "0.022"

// ----------------------------------------------------------------------------
// Audio
// ----------------------------------------------------------------------------
seta s_volume "0.7"
seta s_musicvolume "0.4"

// ----------------------------------------------------------------------------
// Network (for multiplayer testing)
// ----------------------------------------------------------------------------
seta rate "25000"
seta cl_maxpackets "100"
seta snaps "40"

// ----------------------------------------------------------------------------
// Debug / Visualization (uncomment to use)
// ----------------------------------------------------------------------------
// seta rt_debug_lights "1"      // Visualize lights
// seta rt_printPerfStats "1"    // Print RT perf stats
// seta r_showtris "1"           // Wireframe
// seta r_showlightcount "1"     // Light count