name: DX12 Base Build

# Compiles the standalone DX12 sample on a real Windows runner. This is the
# only way to verify the code builds without owning a Windows machine, since
# the sample is Windows-only by design.

on:
  push:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S . -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Build Debug
        run: cmake --build build --config Debug --parallel

      - name: Verify the binary exists
        shell: pwsh
        run: |
          $binaries = Get-ChildItem -Path build -Recurse -Filter dx12_base.exe
          if (-not $binaries) {
            Write-Error "dx12_base.exe was not produced"
            exit 1
          }
          foreach ($exe in $binaries) {
            Write-Host ("Built: {0} ({1:N0} bytes)" -f $exe.FullName, $exe.Length)
          }

      # The runner has no DX12 GPU, so the binary cannot open a window here.
      # --info still exercises adapter enumeration and device creation and
      # reports a clear failure rather than crashing, which is a useful smoke
      # test of the device selection path.
      - name: Smoke test adapter enumeration
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter dx12_base.exe |
                 Select-Object -First 1
          & $exe.FullName --info
          Write-Host "Exit code: $LASTEXITCODE"